<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sandwich Roulette</title>
    <meta name="description" content="Pull the lever. Watch a photoreal sub build itself. Get a counter-ready order from nearly 2 quadrillion possible sandwiches." />
    <meta name="theme-color" content="#008C15" />
    <meta property="og:title" content="Sandwich Roulette" />
    <meta property="og:description" content="A slot machine for your sub order. ~2 quadrillion possibilities, one lever." />
    <meta property="og:image" content="og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='22' fill='%23008C15'/%3E%3Cpath d='M11 27c0-4 5.8-6 13-6s13 2 13 6z' fill='%23F2C27A'/%3E%3Cpath d='M11 27.5h26' stroke='%238FD35A' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M11.5 30h25c0 2.4-5.6 3.6-12.5 3.6S11.5 32.4 11.5 30z' fill='%23D99A4E'/%3E%3C/svg%3E" />
    <style>
      /* First paint before CSS/JS: brand background, no flash. */
      html { background: #f3f6f3; }
      @media (prefers-color-scheme: dark) { html { background: #0a110c; } }
    </style>
  </head>
  <body>
    <div id="app">
      <noscript><p style="padding: 24px; font: 16px system-ui">Sandwich Roulette needs JavaScript to spin the reels.</p></noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // If the app never boots (e.g. the site was published without `npm run build`),
      // say so instead of leaving a silent blank page.
      setTimeout(function () {
        if (window.__sandwichBooted) return;
        var app = document.getElementById('app');
        if (!app) return;
        app.innerHTML =
          '<div style="max-width:560px;margin:15vh auto;padding:24px;font:16px/1.5 system-ui,sans-serif;color:#9fb3a6">' +
          '<h1 style="font-size:22px;color:#e8f1ea;margin:0 0 8px">Sandwich Roulette didn\u2019t load</h1>' +
          '<p style="margin:0">Try a hard refresh. If you own this site: publish it with the build workflow ' +
          '(<code>.github/workflows/deploy.yml</code>), not a raw static upload \u2014 the app only runs after <code>npm run build</code>.</p></div>';
      }, 4000);
    </script>
  </body>
</html>
